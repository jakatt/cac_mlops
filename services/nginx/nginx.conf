# Upgrade header pour WebSocket Gradio
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Vraie IP client — tout le trafic public arrive de Caddy (hôte VPS) via la
# passerelle Docker (172.18.0.1) : sans ces 2 lignes, $binary_remote_addr vaut
# cette passerelle pour TOUS les internautes et la limite « par IP » devient de
# fait une limite unique partagée (constaté 2026-09-27). X-Forwarded-For n'est
# cru que depuis les réseaux privés Docker ; côté Internet, Caddy (≥ 2.5, sans
# trusted_proxies) écrase cet en-tête avec l'IP réelle — non falsifiable.
set_real_ip_from 172.16.0.0/12;
real_ip_header   X-Forwarded-For;

# Rate-limit /predict à 2 niveaux :
#  - par client (IP réelle) : un client abusif est bloqué seul ;
#  - global (clé constante) : plafond de charge du serveur, quel que soit le
#    nombre de clients.
# Rafale par client ≥ 10 OBLIGATOIRE : les tests post-deploy (test-api interne
# puis externe) partent tous du conteneur prefect-worker — la requête externe
# revient par Caddy avec l'IP de ce même conteneur — soit 8 POST /predict en
# quelques secondes sous une seule IP. Avec burst=5, la 7ᵉ (what-if) prenait
# un 429 → rollback du déploiement (incident PR #268, 2026-09-27).
# Vérifiables depuis le Cockpit : Orchestration → « Tester la protection
# anti-abus sur l'API » (flow Prefect test-rate-limit).
limit_req_zone $binary_remote_addr zone=predict_ratelimit:10m rate=20r/m;
limit_req_zone $server_name        zone=predict_global:1m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=token_ratelimit:10m  rate=5r/m;

server {
    listen 80;
    server_name _;

    # DNS Docker interne — re-résolution toutes les 30s
    # Évite le cache IP au démarrage quand l'API est recréée par docker compose up
    resolver 127.0.0.11 valid=30s ipv6=off;

    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host            $host;
    server_tokens off;

    # ── API — /predict (rate-limited) ──────────────────────────────────────────
    location = /predict {
        # Ordre significatif : une requête refusée par la limite par client ne
        # consomme pas de place dans le quota global.
        limit_req zone=predict_ratelimit burst=10 nodelay;
        limit_req zone=predict_global    burst=30 nodelay;
        limit_req_status 429;
        set $api api:8000;
        proxy_pass http://$api;
        proxy_read_timeout 30s;
    }

    # ── API — autres endpoints FastAPI ─────────────────────────────────────────
    location = /health {
        set $api api:8000;
        proxy_pass http://$api;
    }
    location = /token {
        limit_req zone=token_ratelimit burst=3 nodelay;
        limit_req_status 429;
        set $api api:8000;
        proxy_pass http://$api;
    }
    location = /metrics {
        set $api api:8000;
        proxy_pass http://$api;
    }
    location = /openapi.json {
        set $api api:8000;
        proxy_pass http://$api;
    }
    location /docs {
        set $api api:8000;
        proxy_pass http://$api;
    }
    location /redoc {
        set $api api:8000;
        proxy_pass http://$api;
    }

    # ── Drift reports — Evidently HTML (statique) ───────────────────────────────
    location /reports/ {
        alias /srv/reports/;
        add_header X-Content-Type-Options nosniff;
        autoindex off;
    }

    # ── Documentation HTML statique (tableaux fiabilité CI/CD) ─────────────────
    location /ci-docs/ {
        alias /srv/ci-docs/;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        autoindex off;
    }

    # ── nginx exporter — réseau Docker uniquement ───────────────────────────────
    location = /stub_status {
        stub_status;
        allow 172.0.0.0/8;
        deny all;
    }

    # ── Sonde blackbox dédiée gradio-public — /health est déjà pris par FastAPI
    # ci-dessus, il faut un chemin public distinct pour sonder gradio-public en
    # bout-en-bout (Caddy → nginx → gradio-public), cf. dashboards Grafana par accès.
    location = /gradio-public-health {
        set $gradio gradio-public:7862;
        proxy_pass http://$gradio/health;
    }

    # ── Cockpit public Gradio — tout le reste ──────────────────────────────────
    location / {
        set $gradio gradio-public:7862;
        proxy_pass         http://$gradio;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
