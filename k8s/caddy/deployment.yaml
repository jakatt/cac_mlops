# Point d'entrée public unique de Kapsule — TLS (Let's Encrypt automatique)
# devant nginx (rate-limiting/routing inchangés). 2 répliques (2026-07-12,
# SPOF critique sinon : peu importe la HA d'api si le seul caddy tombe,
# plus personne n'atteint quoi que ce soit) — le certificat est donc
# partagé via stockage S3 (image custom ghcr.io/jakatt/cac-mlops-caddy,
# cf. services/caddy/Dockerfile + k8s/caddy/configmap.yaml), plus en
# emptyDir local qui empêcherait 2 pods de partager le même certificat.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: cac-mlops
  labels:
    app: caddy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      # Répartit les répliques sur des nœuds différents quand possible — sans
      # ça le scheduler peut placer les 2 sur le même nœud, rendant illusoire
      # la protection contre une panne de nœud (constaté en direct, 2026-07-14).
      # ScheduleAnyway (souple) : cluster à 2 nœuds seulement, déjà sujet à de
      # la pression ressources — éviter des pods bloqués en Pending.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: caddy
      # Attend que CoreDNS résolve le endpoint S3 avant de démarrer Caddy —
      # sans ça, un kapsule-up (tous les pods du cluster démarrent en même
      # temps, y compris CoreDNS) peut faire perdre la course à Caddy : son
      # tout premier chargement de certificat échoue ("dial tcp: lookup
      # s3.fr-par.scw.cloud ... connection refused"), et Caddy ne retente pas
      # avant son prochain cycle de renewal — le pod tourne, TCP:80 répond,
      # mais HTTPS reste cassé indéfiniment (incident vécu, kapsule-up du
      # 2026-07-28 après un kapsule-down la veille — resté cassé ~30 min avant
      # correction manuelle). exit 1 en timeout : le kubelet relance l'init
      # container (pas tout le pod), Caddy ne démarre alors QUE quand le DNS
      # est vraiment prêt, sans jamais tenter un premier chargement voué à
      # l'échec.
      initContainers:
      - name: wait-for-dns
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          for i in $(seq 1 30); do
            nslookup s3.fr-par.scw.cloud >/dev/null 2>&1 && { echo "DNS OK (tentative $i/30)"; exit 0; }
            sleep 2
          done
          echo "DNS toujours indisponible après 60s — retry de l'init container"
          exit 1
      # Caddy route par SNI — une requête HTTPS locale avec Host/SNI="localhost"
      # ne correspond à aucun site configuré (seul kapsule.jakat-inc.fr existe)
      # et échoue au handshake TLS (constaté en direct : "tlsv1 alert internal
      # error"), ce qui rendrait les probes ci-dessous inutilisables sans
      # dépendre du DNS public. hostAliases résout kapsule.jakat-inc.fr vers
      # 127.0.0.1 UNIQUEMENT dans ce pod — la probe teste ainsi le vrai
      # certificat/site, en local, sans egress ni DNS externe.
      hostAliases:
      - ip: "127.0.0.1"
        hostnames:
        - "kapsule.jakat-inc.fr"
      containers:
      - name: caddy
        image: ghcr.io/jakatt/cac-mlops-caddy:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        - containerPort: 443
        env:
        # Clé IAM dédiée, restreinte au préfixe caddy-certs/ via bucket
        # policy (pas s3-creds — évite d'exposer les credentials globaux du
        # bucket dans les logs `tls` internes de Caddy, cf. finding sécurité
        # noté lors de la PR HA Caddy).
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: caddy-s3-creds
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: caddy-s3-creds
              key: AWS_SECRET_ACCESS_KEY
        volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
        - name: caddy-data
          mountPath: /data
        - name: caddy-config-dir
          mountPath: /config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # tcpSocket:80 (avant) ne détectait pas l'incident du 2026-07-28 : le
        # port TCP répond même quand le certificat TLS n'a jamais pu être
        # chargé (Caddy écoute, mais toute connexion HTTPS échoue en
        # ERR_SSL_PROTOCOL_ERROR). On teste maintenant le handshake TLS
        # lui-même — wget distingue "connexion/TLS établie" (code retour 0 ou
        # 8, réponse HTTP obtenue même en erreur) de "échec de connexion/TLS"
        # (tout autre code) : ça permet de repérer un cert cassé sans se
        # coupler à la santé du backend nginx/api derrière (un 502 backend
        # temporaire ne doit pas faire échouer cette probe).
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              wget -T 5 -qO /dev/null --no-check-certificate https://kapsule.jakat-inc.fr/caddy-health 2>/dev/null
              rc=$?
              [ "$rc" -eq 0 ] || [ "$rc" -eq 8 ]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              wget -T 5 -qO /dev/null --no-check-certificate https://kapsule.jakat-inc.fr/caddy-health 2>/dev/null
              rc=$?
              [ "$rc" -eq 0 ] || [ "$rc" -eq 8 ]
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
      volumes:
      - name: caddy-config
        configMap:
          name: caddy-config
      - name: caddy-data
        emptyDir: {}
      - name: caddy-config-dir
        emptyDir: {}
